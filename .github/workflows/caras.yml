# Caras conocidas, base de wallets y registro de tokens: cada 30 minutos apunta tokens nuevos, mira cómo acabaron
# los de hace 24 h (y 7 días en el registro) y publica caras.json y datos/ en solflag.com: van en la rama "datos" y
# pages.yml los junta con la web, así no llenan de commits la rama main. La memoria entre ejecuciones va en
# Cloudflare KV (tools/caras/nube.mjs) con la caché de Actions de respaldo.
name: caras
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caras
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cambios: ${{ steps.pub.outputs.cambios }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: datos
          path: _pub
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # este trabajo tiene secretos y permiso de escritura: sin caché de npm compartida
      - name: Motor de SolFlag (para el registro de tokens)
        run: npm ci --prefix tools/caras --no-audit --no-fund
      - uses: actions/cache/restore@v6
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
          restore-keys: caras-
      - name: Memoria desde Cloudflare (si es más nueva que la de la caché)
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: node tools/caras/nube.mjs bajar
      - name: Recolectar
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
          PUB_DIR: _pub
          # plano del dinero (tools/caras/plano.mjs): enlaces de cada lanzamiento a Cloudflare D1
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: node tools/caras/collect.mjs
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
      - name: Guardar la memoria en Cloudflare
        if: always()
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: node tools/caras/nube.mjs subir
      - name: Subir caras.json, la base de wallets y el registro a la rama datos si han cambiado
        id: pub
        working-directory: _pub
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "solflag-caras"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "caras.json, base de wallets y registro: actualizado"
          git pull --rebase -q && git push -q
          echo "cambios=1" >> "$GITHUB_OUTPUT"
  pages:
    needs: collect
    if: needs.collect.outputs.cambios == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
