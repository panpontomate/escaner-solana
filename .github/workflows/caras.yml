# Caras conocidas y base de wallets: cada 30 minutos apunta tokens nuevos, mira cómo acabaron los de hace 24 h
# y publica caras.json y datos/ en solflag.com. La memoria entre ejecuciones va en la caché de Actions.
name: caras
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caras
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
          restore-keys: caras-
      - name: Recolectar
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
        run: node tools/caras/collect.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
      - name: Publicar caras.json y la base de wallets si han cambiado
        run: |
          git add -N datos 2>/dev/null || true
          git diff --quiet -- caras.json datos && exit 0
          git config user.name "solflag-caras"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caras.json datos
          git commit -m "caras.json y base de wallets: actualizado"
          git pull --rebase -q && git push -q
