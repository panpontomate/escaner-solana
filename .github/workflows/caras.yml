# Caras conocidas, base de wallets y registro de tokens: cada 30 minutos apunta tokens nuevos, mira cómo acabaron
# los de hace 24 h (y 7 días en el registro) y publica caras.json y datos/ en solflag.com. La memoria entre ejecuciones va en Cloudflare KV
# (tools/caras/nube.mjs) con la caché de Actions de respaldo.
name: caras
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caras
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Motor de SolFlag (para el registro de tokens)
        run: npm ci --prefix tools/caras --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
          restore-keys: caras-
      - name: Memoria desde Cloudflare (si es más nueva que la de la caché)
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: node tools/caras/nube.mjs bajar
      - name: Recolectar
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
        run: node tools/caras/collect.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
      - name: Guardar la memoria en Cloudflare
        if: always()
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: node tools/caras/nube.mjs subir
      - name: Publicar caras.json y la base de wallets si han cambiado
        run: |
          git add -N datos 2>/dev/null || true
          git diff --quiet -- caras.json datos && exit 0
          git config user.name "solflag-caras"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caras.json datos
          git commit -m "caras.json, base de wallets y registro: actualizado"
          git pull --rebase -q && git push -q
