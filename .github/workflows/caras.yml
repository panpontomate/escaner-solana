# Caras conocidas, base de wallets y registro de tokens: cada hora (lo lanza el Worker solflag-api) apunta tokens nuevos, mira cómo acabaron
# los de hace 24 h (y 7 días en el registro) y publica caras.json y datos/ en solflag.com: van en la rama "datos" y
# pages.yml los junta con la web, así no llenan de commits la rama main. La memoria entre ejecuciones va en
# Cloudflare KV (tools/caras/nube.mjs) con la caché de Actions de respaldo.
name: caras
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caras
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cambios: ${{ steps.pub.outputs.cambios }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: datos
          path: _pub
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # este trabajo tiene secretos y permiso de escritura: sin caché de npm compartida
      - name: Motor de SolFlag (para el registro de tokens)
        run: npm ci --prefix tools/caras --no-audit --no-fund
      - uses: actions/cache/restore@v6
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
          restore-keys: caras-
      - name: Memoria desde Cloudflare (si es más nueva que la de la caché)
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: node tools/caras/nube.mjs bajar
      - name: Recolectar
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
          PUB_DIR: _pub
          # tokens nuevos analizados con el motor por vuelta (12/11/2026: de 40 a 70, todos los que entran; Helius
          # iba por ~15.000 créditos al día de 1 M al mes. Si un ciclo entero se acerca al millón, bajarlo a 55)
          # 27/11: a 55 (reparto de Helius: el recolector se llevaba ~75 % del gasto; ~3.000 créditos menos al día)
          REG_MAX: "55"
          # plano del dinero (tools/caras/plano.mjs): enlaces de cada lanzamiento a Cloudflare D1
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          # aviso si RugCheck deja de responder (el mismo bot de avisos que usa el vigilante)
          AVISO_TELEGRAM_TOKEN: ${{ secrets.AVISO_TELEGRAM_TOKEN }}
          AVISO_TELEGRAM_CHAT: ${{ secrets.AVISO_TELEGRAM_CHAT }}
          # 27/11: el radar de lanzamientos (tools/caras/radar.mjs) se apaga: el canal t.me/SolFlagRadar lo lleva ahora
          # la recogida (tools/recogida/radar.mjs, avisos de los proyectos que seguimos). Sin el token, collect.mjs no publica.
        run: node tools/caras/collect.mjs
      # Mapa del momento de la página Escáner (datos/momento.json), con su propio motor. Si falla, se queda el anterior y
      # el resto del recolector sigue igual. 27/11: cada 3 h en vez de cada hora (~1.000 créditos de Helius menos al día):
      # se rehace cuando el que hay tiene 2 h 50 min o más (así, si GitHub se salta una vuelta, lo rehace la siguiente)
      - name: Mapa del momento
        continue-on-error: true
        timeout-minutes: 8
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
          PUB_DIR: _pub
        run: |
          if node -e 'const j=JSON.parse(require("fs").readFileSync("_pub/datos/momento.json","utf8")); process.exit(Date.now()-j.at<170*60e3?0:1)' 2>/dev/null; then
            echo "Mapa del momento: el de ahora es reciente, toca cada 3 h"; exit 0
          fi
          npm ci --prefix tools/momento --no-audit --no-fund
          node tools/momento/momento.mjs
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: tools/caras/estado.json
          key: caras-${{ github.run_id }}
      - name: Guardar la memoria en Cloudflare
        if: always()
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: node tools/caras/nube.mjs subir
      - name: Subir caras.json, la base de wallets y el registro a la rama datos si han cambiado
        id: pub
        working-directory: _pub
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "solflag-caras"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "caras.json, base de wallets y registro: actualizado"
          git pull --rebase -q && git push -q
          echo "cambios=1" >> "$GITHUB_OUTPUT"
  pages:
    needs: collect
    if: needs.collect.outputs.cambios == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
