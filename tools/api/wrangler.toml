# Worker de la API pública de SolFlag. Para publicarlo (una vez): npx wrangler login, poner el id de la base D1
# «solflag-plano» (el mismo que el secreto CF_D1_ID del recolector) y npx wrangler deploy desde esta carpeta.
name = "solflag-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# reloj de los workflows (lanza recogida.yml y caras.yml; ver lanzarWorkflow en worker.js)
[triggers]
crons = ["3,18,33,48 * * * *", "7,37 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "solflag-plano"
database_id = "419668bd-32cd-4673-af81-2e1780cdb60d"

[[routes]]
pattern = "api.solflag.com"
custom_domain = true

# la ficha pública de cada token (ficha.js)
[[routes]]
pattern = "token.solflag.com"
custom_domain = true

# límite de avisos de escaneo (POST /api/visto): 20 por minuto por conexión
[[ratelimits]]
name = "VISTO_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# límite de /api/ventas (marcas de la gráfica, gasta créditos de Helius): 10 por minuto por conexión
[[ratelimits]]
name = "VENTAS_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# límite de /api/top (mayores cuentas para el análisis, gasta créditos de Helius): 30 por minuto por conexión
[[ratelimits]]
name = "TOP_LIMIT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# límite de /api/rpc (plan B de RPC de la web, gasta créditos de Helius): 120 por minuto por conexión
[[ratelimits]]
name = "RPC_LIMIT"
namespace_id = "1004"
simple = { limit = 120, period = 60 }
