# Worker de la API pública de SolFlag. Para publicarlo (una vez): npx wrangler login, poner el id de la base D1
# «solflag-plano» (el mismo que el secreto CF_D1_ID del recolector) y npx wrangler deploy desde esta carpeta.
name = "solflag-api"
main = "worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "solflag-plano"
database_id = "419668bd-32cd-4673-af81-2e1780cdb60d"

[[routes]]
pattern = "api.solflag.com"
custom_domain = true

# límite de avisos de escaneo (POST /api/visto): 20 por minuto por conexión
[[ratelimits]]
name = "VISTO_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
